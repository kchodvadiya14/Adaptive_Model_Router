services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - path: backend/.env
        required: false   # optional: without it the container starts with defaults (no provider keys)
    environment:
      DATABASE_URL: sqlite:///./state/router.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      # Everything the app writes: DB, model registry + datasets, experiment reports, trained routers.
      - router-state:/app/state
      - router-processed:/app/data/processed
      - router-experiments:/app/experiments/reports
      - router-models:/app/models
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  router-state:
  router-processed:
  router-experiments:
  router-models:
